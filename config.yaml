project:
  name: RT_DETR_Project
  work_dir: workspace
  seed: 42
  device: auto
extraction:
  video_path: data/videos
  output_dir: workspace/frames
  negative_output_dir: workspace/negatives
  sample_fps: 4.0
  frame_step: null
  blur_filter:
    enabled: true
    min_laplacian_variance: 80.0
  deduplication:
    enabled: true
    similarity_threshold: 0.96
  negative_harvesting:
    enabled: true
    negative_video_path: data/negative_videos
    motion_threshold: 0.02
    max_negatives: 200
annotation:
  annotation_dir: data/annotations
  class_names:
  - scooter
  auto_label:
    enabled: true
    model: rtdetr-l.pt
    conf_threshold: 0.5
    classes:
    - 3
dataset:
  output_dir: workspace/dataset
  train_ratio: 0.7
  val_ratio: 0.2
  test_ratio: 0.1
  false_positive_mitigation:
    include_background_images: true
    target_background_ratio: 0.15
    hard_negatives_dir: data/hard_negatives
training:
  model_architecture: rtdetr-l.pt
  imgsz: 640
  epochs: 2
  batch_size: 4
  workers: 0
  patience: 10
  optimizer: AdamW
  lr0: 0.0005
  lrf: 0.01
  weight_decay: 0.0001
  save_period: 5
  resume: false
evaluation:
  runs_dir: workspace/evaluation
  target_precision: 0.99
  max_acceptable_fp_count: 0
  iou_threshold: 0.5
  min_box_area: 100
  aspect_ratio_range:
  - 0.1
  - 10.0
export:
  output_dir: workspace/exported_models
  formats:
  - onnx
  - torchscript
  - openvino
  onnx:
    opset: 17
    dynamic: false
    simplify: true
    half: false
